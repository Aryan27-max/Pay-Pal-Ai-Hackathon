# Render Blueprint for Relief Stream (render.com/docs/blueprint-spec, checked 2026-11-07).
# FREE TIERS ONLY (decision 2026-11-07): one free web service; verification runs INLINE in it
# (RENDER_WORKFLOW_SERVICE_ID unset → workflows/dispatch.ts runs the same functions in-process).
#   web       Next.js app (stream page, claims API, reviewer queue, admin)      plan free
#   workflow  NOT deployed: Render Workflows has no free tier (per-second billing). The task service is
#             built and its 8 tasks register (workflows/render.ts); to switch it on, uncomment the block
#             at the end and set RENDER_API_KEY, RENDER_WORKFLOW_SERVICE_ID and RENDER_WORKFLOW_SLUG.
#   Postgres  the EXISTING Render Postgres (Singapore). It already holds the data the local simulators
#             read, so this Blueprint does not create a second database: paste its INTERNAL connection
#             string as DATABASE_URL when Render asks (Dashboard → your Postgres → Connections).
# Everything runs in singapore, the database's region, so all traffic stays on Render's private network.
# Secrets are `sync: false`: Render prompts for them once, when the Blueprint is first created.
# Sandbox and devnet only: PAYPAL_API_BASE must be the sandbox host (check:env enforces it).

envVarGroups:
  - name: relief-stream-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CLAIM_ID_SALT
        sync: false
      - key: REVIEWER_ACCESS_TOKEN
        sync: false
      - key: AUTO_PAYOUT_THRESHOLD
        value: "75"
      - key: HUMAN_REVIEW_THRESHOLD
        value: "50"
      - key: DEFAULT_PACKET_USD
        value: "50"
      - key: MAX_FIRST_PACKET_USD
        value: "100"
      - key: WEIGHT_PHOTO
        value: "30"
      - key: WEIGHT_LOCATION
        value: "25"
      - key: WEIGHT_MESSAGE
        value: "20"
      - key: WEIGHT_UNIQUENESS
        value: "15"
      - key: WEIGHT_VOUCHING
        value: "10"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_POOL_BUSINESS_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_REASONING
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_VISION
        value: gemini-3.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      # Off in production (Phase 1 rule): every claim on the hosted app calls the AI (~7 Flash-Lite calls per demo run).
      - key: AI_DEMO_CACHE
        value: "off"
      - key: WHISPER_MODE
        value: groq
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: CLIP_MODE
        value: local
      - key: CLIP_MODEL_ID
        value: Xenova/clip-vit-base-patch32
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ELASTIC_CLAIMS_INDEX
        value: relief-claims
      - key: ELASTIC_PHOTOS_INDEX
        value: relief-photos
      - key: GDACS_FEED_URL
        value: https://www.gdacs.org/gdacsapi/api/Events/geteventlist/search?eventlist=FL;TC;EQ;WF;VO
      - key: USGS_FEED_URL
        value: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_week.geojson
      - key: SIMULATED_EVENT
        value: "on"
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_REVIEW_WEBHOOK_URL
        sync: false
      - key: ZAPIER_ALERT_WEBHOOK_URL
        sync: false
      - key: POOL_LOW_USD
        value: "100"

services:
  - type: web
    name: relief-stream-web
    runtime: node
    region: singapore
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip the build tooling (typescript, tailwind, tsx).
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run clip:prefetch && npm run build
    startCommand: npm start
    healthCheckPath: /api/pool
    envVars:
      - fromGroup: relief-stream-shared
      # Browser-side PayPal JS SDK id (same value as PAYPAL_CLIENT_ID); inlined at build time.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false

  # Render Workflows (paid, per-second; off for the free-tier deploy). To enable: uncomment, and add
  # RENDER_API_KEY, RENDER_WORKFLOW_SERVICE_ID (the workflow's id) and RENDER_WORKFLOW_SLUG to the web service.
  # - type: workflow
  #   name: relief-stream-workflows
  #   runtime: node
  #   region: singapore
  #   buildCommand: npm ci --include=dev && npm run clip:prefetch
  #   startCommand: npx tsx workflows/render.ts
  #   envVars:
  #     - fromGroup: relief-stream-shared
